name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local project without third-party runtime dependencies
        run: python -m pip install -e .
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic BES look-ahead example (no external code)
        run: python -m examples.bes_lookahead_smoke
      - name: Reproduce dependent-versus-independent diagnostic example
        run: python -m examples.conditional_dependence_smoke
      - name: Validate publication-quality U-CODE SVG geometry and arrows
        run: python -m scripts.validate_framework_figure
      - name: Print six-model selected planning roster with hard readiness blockers
        run: python -m ucode.model_readiness
      - name: Audit and package source-free 120-PR metadata dataset (NO executable tasks)
        run: python -m scripts.audit_dataset_quality --output-dir dist/ucode-pr-metadata-clean
      - name: Verify exported eight-file dataset SHA256 and no extra labels
        run: python -m scripts.verify_dataset_release dist/ucode-pr-metadata-clean
      - name: Publish clean metadata dataset for independent inspection
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-pr-metadata-clean-v1
          path: dist/ucode-pr-metadata-clean/
          if-no-files-found: error
      - name: Export conservative provenance overlap graph (NO task split)
        run: python -m scripts.audit_lineage_risks --output-dir dist/ucode-lineage-review
      - name: Publish metadata-only lineage warnings for reviewer adjudication
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-lineage-review-only-v1
          path: dist/ucode-lineage-review/
          if-no-files-found: error
      - name: Validate canonical GitHub audit ledger (metadata only)
        run: python -m scripts.summarize_audit --audit-dir data/audits/2026-10-24 --manifest data/discovery/agent_pr_candidates_120.csv
      - name: Display noneligible source-path leads for human review (no network)
        run: python -m scripts.triage_review_queue --limit 12
      - name: Check real PR task-admission dossiers against immutable audit (no execution)
        run: python -m scripts.check_task_admission
      - name: Validate prospectively unsealed evaluator-only metadata (no oracle execution)
        run: python -m scripts.check_evaluator_boundary
      - name: Reproduce independent mathematical odd-payout ambiguity witness
        run: python -m examples.pilot_oracle_boundary_smoke
      - name: Replay synthetic uncertainty-blind generation, diagnostic and repair trace
        run: python -m examples.blind_search_smoke
      - name: Validate frozen BES versus blind search opportunities and five budgets
        run: python -m examples.action_parity_smoke
      - name: Validate prospective SBSE eight-policy six-checkpoint registration
        run: python -m scripts.validate_sbse_protocol
      - name: Validate all six AI Galaxy model hardware and startup gates (offline)
        run: python -m scripts.plan_ai_galaxy_six_models
      - name: Reproduce hypothetical one-A100 40-task rental scenario (NOT measured)
        run: python -m scripts.estimate_ai_galaxy_rental --tasks 40 --policies 2 --seeds 1 --minutes-per-assignment 5
      - name: Validate candidate model and dataset registries
        run: python -m scripts.validate_research_registries
      - name: Reproduce first-party structural five-resource meter and ledger smoke
        run: python -m examples.metering_contract_smoke
      - name: Compile original source only
        run: python -m compileall -q src
      - name: Export official-template Overleaf source bundle
        if: matrix.python-version == '3.12'
        run: python -m scripts.export_overleaf --output dist/UCODE_Overleaf_sources.zip
      - name: Attach Overleaf source-only ZIP to this CI run
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-overleaf-sources
          path: dist/UCODE_Overleaf_sources.zip
          if-no-files-found: error
