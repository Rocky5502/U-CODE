name: offline-tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local project without third-party runtime dependencies
        run: python -m pip install -e .
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
      - name: Audit Springer Overleaf source, references, abstract and non-results claims
        run: python -m scripts.audit_overleaf_sources
      - name: Validate new-chat handoff against model, task and study registries (no real trial)
        run: python -m scripts.validate_research_handoff
      - name: Validate canonical V4 takeover roles, frozen evidence and unblocked gate
        run: python -m scripts.validate_v4_handoff
      - name: Reproduce synthetic BES look-ahead example (no external code)
        run: python -m examples.bes_lookahead_smoke
      - name: Reproduce dependent-versus-independent diagnostic example
        run: python -m examples.conditional_dependence_smoke
      - name: Validate publication-quality U-CODE SVG geometry and arrows
        run: python -m scripts.validate_framework_figure
      - name: Print six-model selected planning roster with hard readiness blockers
        run: python -m ucode.model_readiness
      - name: Reproduce mixed evidence versus generation switch (synthetic ONLY)
        run: python -m examples.robust_mixed_smoke
      - name: Verify joint scenario evidence and generation minmax (synthetic ONLY)
        run: python -m examples.joint_scenario_action_smoke
      - name: Reproduce finite-scenario evidence ambiguity witness (synthetic ONLY)
        run: python -m examples.scenario_robust_evidence_smoke
      - name: Validate official pre-PR issue chronology for two source leads (NO task admission)
        run: python -m scripts.verify_two_issue_chronologies
      - name: Audit public GitHub issue event first pages (NO source or spec admission)
        run: python -m scripts.verify_issue_event_windows
      - name: Quarantine post-PR current issue bodies (NO historical spec admission)
        run: python -m scripts.audit_live_issue_spec_quarantine
      - name: Validate PHP #104 source-era contract leads and parent issue identity (NO source execution)
        run: python -m scripts.verify_php104_source_contracts
      - name: Check PHP #104 reviewer oracle blueprint (NO gold tests or PHP execution)
        run: python -m scripts.verify_php104_oracle_blueprint
      - name: Validate pinned pre-fix Git tree and toolchain path evidence (NO checkout)
        run: python -m scripts.verify_pre_fix_git_trees
      - name: Audit and package source-free 120-PR metadata dataset (NO executable tasks)
        run: python -m scripts.audit_dataset_quality --output-dir dist/ucode-pr-metadata-clean
      - name: Verify exported eight-file dataset SHA256 and no extra labels
        run: python -m scripts.verify_dataset_release dist/ucode-pr-metadata-clean
      - name: Reproduce evaluator-only postterminal ITT and missingness bounds (synthetic, NO real oracle)
        run: python -m scripts.smoke_postterminal_accounting
      - name: Export dataset-grounded metric definitions and study readiness with no invented results
        run: python -m scripts.export_research_readiness --output-dir dist/ucode-research-readiness
      - name: Upload metric dictionary and independently auditable research readiness summary
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-research-readiness-metrics-v1
          path: dist/ucode-research-readiness/
          if-no-files-found: error
      - name: Publish clean metadata dataset for independent inspection
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-pr-metadata-clean-v1
          path: dist/ucode-pr-metadata-clean/
          if-no-files-found: error
      - name: Export conservative provenance overlap graph (NO task split)
        run: python -m scripts.audit_lineage_risks --output-dir dist/ucode-lineage-review
      - name: Verify lineage-review SHA256 and blocked-split integrity
        run: python -m scripts.verify_lineage_review dist/ucode-lineage-review
      - name: Publish metadata-only lineage warnings for reviewer adjudication
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-lineage-review-only-v1
          path: dist/ucode-lineage-review/
          if-no-files-found: error
      - name: Validate canonical GitHub audit ledger (metadata only)
        run: python -m scripts.summarize_audit --audit-dir data/audits/2026-10-24 --manifest data/discovery/agent_pr_candidates_120.csv
      - name: Display noneligible source-path leads for human review (no network)
        run: python -m scripts.triage_review_queue --limit 12
      - name: Produce twelve reviewer-only evidence packets with 96 open admission gates
        run: python -m scripts.export_pending_review_packets --output-dir dist/ucode-admission-review-only
      - name: Validate all generated pending reviewer packets against canonical audit
        run: python -m scripts.check_task_admission --dossiers dist/ucode-admission-review-only/review_packet_12_PENDING.jsonl
      - name: Publish human-only pending admission review packet
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-admission-review-only-v1
          path: dist/ucode-admission-review-only/
          if-no-files-found: error
      - name: Generate independent A/B reviewer evidence worksheets (no approval)
        run: python -m scripts.export_independent_review_forms --output-dir dist/ucode-independent-reviewers-only
      - name: Validate independent reviewer worksheets, original packet identities and hashes
        run: python -m scripts.verify_independent_review_forms dist/ucode-independent-reviewers-only
      - name: Publish independent pending reviewer worksheets for offline adjudication
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-two-reviewer-forms-PENDING-v1
          path: dist/ucode-independent-reviewers-only/
          if-no-files-found: error
      - name: Check real PR task-admission dossiers against immutable audit (no execution)
        run: python -m scripts.check_task_admission
      - name: Validate prospectively unsealed evaluator-only metadata (no oracle execution)
        run: python -m scripts.check_evaluator_boundary
      - name: Reproduce independent mathematical odd-payout ambiguity witness
        run: python -m examples.pilot_oracle_boundary_smoke
      - name: Replay synthetic uncertainty-blind generation, diagnostic and repair trace
        run: python -m examples.blind_search_smoke
      - name: Validate frozen BES versus blind search opportunities and five budgets
        run: python -m examples.action_parity_smoke
      - name: Audit synthetic eight-policy public-opportunity parity (NO agent trials)
        run: python -m scripts.audit_shadow_assignment_parity
      - name: Cross-check six selected models against deployment and protocol (NO GPU)
        run: python -m scripts.audit_six_model_crosswalk
      - name: Run six-name eight-slot evaluator-blind shadow smoke (NO real tasks/models)
        run: python -m scripts.smoke_shadow_eight_arm_runner
      - name: Replay shared synthetic public tool outcomes across eight slots (NO models or oracle)
        run: python -m scripts.smoke_frozen_public_replay
      - name: Replay unique candidate-targeted action IDs across scripted eight-slot fixture (NO LLM)
        run: python -m scripts.smoke_action_id_replay_bridge
      - name: Exercise adaptive fixed-test and uncertainty-free policy selection (SYNTHETIC ONLY)
        run: python -m scripts.smoke_adaptive_reference_replay
      - name: Reproduce third synthetic uncertainty-only confidence baseline (NO LLM or oracle)
        run: python -m scripts.smoke_uncertainty_only_reference
      - name: Replan a two-probe conditional BES policy using the same synthetic public book (NO LLM)
        run: python -m scripts.smoke_conditional_bes_public_replay
      - name: Inspect bounded OCI first-party launch profile with fake digest (NO Docker execution)
        run: python -m scripts.smoke_oci_sandbox_preflight
      - name: Validate prospective SBSE eight-policy six-checkpoint registration
        run: python -m scripts.validate_sbse_protocol
      - name: Validate all six AI Galaxy model hardware and startup gates (offline)
        run: python -m scripts.plan_ai_galaxy_six_models
      - name: Reproduce hypothetical one-A100 40-task rental scenario (NOT measured)
        run: python -m scripts.estimate_ai_galaxy_rental --tasks 40 --policies 2 --seeds 1 --minutes-per-assignment 5
      - name: Validate candidate model and dataset registries
        run: python -m scripts.validate_research_registries
      - name: Reproduce first-party structural five-resource meter and ledger smoke
        run: python -m examples.metering_contract_smoke
      - name: Compile original source only
        run: python -m compileall -q src
      - name: Export official-template Overleaf source bundle
        if: matrix.python-version == '3.12'
        run: python -m scripts.export_overleaf --output dist/UCODE_Overleaf_sources.zip
      - name: Attach Overleaf source-only ZIP to this CI run
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: ucode-overleaf-sources
          path: dist/UCODE_Overleaf_sources.zip
          if-no-files-found: error
