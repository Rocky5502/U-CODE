[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ucode-research"
version = "0.1.0"
description = "Prospective research on budget-aware evidence acquisition and patch search for reliable AI-generated software"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "U-CODE Research Contributors"}]
keywords = ["search-based software engineering", "software repair", "uncertainty", "coding agents", "reproducibility"]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Rocky5502/U-CODE"
Repository = "https://github.com/Rocky5502/U-CODE"
Issues = "https://github.com/Rocky5502/U-CODE/issues"
Documentation = "https://github.com/Rocky5502/U-CODE/blob/main/README.md"

[project.scripts]
ucode = "ucode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
